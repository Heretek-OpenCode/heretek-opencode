id: searxng
name: SearXNG
tier: core
license: { spdx: AGPL-3.0-only }
image: { repo: searxng/searxng, tag: latest }
port: 8080
networks: [svc, egress-web]
requires: [valkey]
resources:
  lite: { cpus: 0.5, mem: 512m }
  standard: { cpus: 1, mem: 1g }
hardening: { user: "977:977", read_only: false, tmpfs: ["/tmp"] }
egress: { proxy: smokescreen, direct_peers: [gateway] }
health:
  test: ["CMD-SHELL", "env -u HTTP_PROXY -u HTTPS_PROXY -u http_proxy -u https_proxy wget -q -O /dev/null http://localhost:8080/ || exit 1"]
  interval: 30s
tools: [search]
